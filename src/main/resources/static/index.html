<!DOCTYPE html>
<html>

<head>
    <title>Hello WebSocket</title>
    <!-- CDN for Boostrap (CSS) -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"> -->

    <!-- Local Bootstrap (CSS) -->
    <link href="/scripts/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <noscript>
        <div class="alert alert-danger text-center m-4">
            Javascript must be enabled for WebSocket support.
        </div>
    </noscript>

    <div id="main-content" class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm rounded-4">

                    <div class="card-body">

                        <h3 class="card-title text-center mb-4">
                            💬 Chat WebSocket
                        </h3>

                        <div class="d-flex justify-content-between mb-3">

                            <button id="disconnect" class="btn btn-outline-danger" type="button">
                                Disconnect
                            </button>

                        </div>

                        <form class="row g-3 align-items-center" id="form">

                            <div class="col-md-9">

                                <input type="text" id="content" class="form-control"
                                    placeholder="Enter your message...">

                            </div>

                            <div class="col-md-3 d-grid">

                                <button id="send" class="btn btn-primary" type="submit">
                                    Send
                                </button>

                            </div>

                        </form>

                        <hr class="my-4">

                        <table id="conversation" class="table table-hover align-middle">

                            <thead class="table-light">
                                <tr>
                                    <th>Messages</th>
                                </tr>
                            </thead>

                            <tbody id="messages"></tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- CDNs Bootstrap (JS)/Stomp/SockJS for Web  -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script> -->

    <!-- Bootstrap (JS)/Stomp/SockJS - local dependencies -->
    <script src="/scripts/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/scripts/vendor/sockjs.min.js"></script>
    <script src="/scripts/vendor/stomp.umd.min.js"></script>

    <script src="/scripts/app.js" type="module"></script>

</body>

</html>
