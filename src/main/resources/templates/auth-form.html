<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="fr">

<head>
    <title>🔐 Chat App | Portail de connexion</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CDN for Boostrap (CSS) -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"> -->

    <!-- Local Bootstrap (CSS) -->
    <link th:href="@{/scripts/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5 d-flex justify-content-center align-items-center" style="min-height:100vh;">
        <form method="POST" id="authForm" class="d-grid gap-3">
            <h3 class="text-center mb-4">🔐 Portail du Chat</h3>

            <!-- Username field -->
            <div>
                <label class="form-label">
                    Nom d'utilisateur
                </label>
                <input type="text" name="username" class="form-control" required />
            </div>

            <!-- Password field -->
            <div>
                <label class="form-label">
                    Mot de passe
                </label>
                <input type="password" name="password" class="form-control" required />
            </div>

            <!-- Submit -->
            <div class="d-grid gap-2 mt-2">
                <button type="submit" class="btn btn-primary">
                    Se connecter
                </button>
            </div>
        </form>
    </div>
    <script th:src="@{/scripts/auth.js}" type="module"></script>

    <!-- CDNs Bootstrap (JS)/Stomp/SockJS for Web  -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> -->

    <!-- Bootstrap (JS)/Stomp/SockJS - local dependencies -->
    <script th:src="@{/scripts/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
</body>

</html>
