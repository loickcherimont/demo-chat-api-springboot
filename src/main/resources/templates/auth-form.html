<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">

<head>
    <title>AuthForm</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <h1>Authentification</h1>
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>
    <form action="#" th:action="@{/auth-form}" th:object="${authForm}" method="post">
        <p>Username: <input type="text" th:field="*{username}" required /></p>
        <p>Password: <input type="password" th:field="*{password}" required /></p>
        <p><input type="submit" value="Se connecter" /> <input type="reset" value="Reset" /></p>
    </form>
</body>

</html>
